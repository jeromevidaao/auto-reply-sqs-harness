name: CI

env:
  # Opt into Node.js 24 for all actions to avoid Node 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      # Force Node 24 runtime for actions that still declare node20 internally.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          # Live Grok tests (Cassidy parking regression, etc.) skip without this.
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: npm test

  eval:
    name: Run Evaluation Suite
    needs: test
    runs-on: ubuntu-latest
    env:
      # Force Node 24 runtime for actions that still declare node20 internally.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # GROK_API_KEY is optional. When present the eval runs the full live-Grok suite
      # (all goldens with real model + tools + reflection + judge). When absent it
      # exits cleanly (0) so CI stays green. Matches the "never mock" rule.
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      # Synthetic host contacts only (never production phones in CI logs)
      ALLOW_HOST_CONTACT_TEST_DEFAULTS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run evaluation harness
        run: npm run eval -- --fail-fast

  # Optional: Build the Lambda package as an artifact on main
  # This is useful even before full CD is set up
  build-lambda:
    name: Build Lambda Package
    needs: eval
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Only build on main to avoid spamming artifacts on every PR
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Lambda package
        run: |
          # Create a clean staging directory
          mkdir -p /tmp/lambda-deploy
          cp -r src prompts lambda /tmp/lambda-deploy/
          cp package.json /tmp/lambda-deploy/
          cp -r node_modules /tmp/lambda-deploy/

          cd /tmp/lambda-deploy
          zip -r /tmp/guest-messaging-harness.zip . -q

          # Move to the workspace for artifact upload
          mv /tmp/guest-messaging-harness.zip $GITHUB_WORKSPACE/

      # Deploy rebuilds the zip itself; artifact is optional. Do not fail CI on storage quota.
      - name: Upload Lambda artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: guest-messaging-harness-lambda
          path: guest-messaging-harness.zip
          retention-days: 3
