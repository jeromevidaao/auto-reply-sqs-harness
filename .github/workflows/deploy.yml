name: Deploy to AWS Lambda

env:
  # Opt into Node.js 24 for all actions to avoid Node 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Deploy only after CI passes on main (fail-fast: no deploy if tests/eval failed)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Manual trigger (useful for emergency/hotfix deploys or rollbacks)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (for future use)'
        required: false
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy guest-messaging-agent-harness
    # Skip deploy when CI failed or was cancelled (manual workflow_dispatch always runs)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Force Node 24 runtime for actions that still declare node20 internally.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # Required for OIDC
    permissions:
      id-token: write
      contents: read

    # IMPORTANT: For safe continuous deployment, you MUST enable Branch Protection
    # on the `main` branch and require the CI jobs ("Run Tests" and "Run Evaluation Suite")
    # to pass before allowing merges. This prevents broken code from being deployed.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit that passed CI (workflow_run), not a newer push
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug - Show role ARN (remove after testing)
        run: |
          echo "Role ARN from secret: ${{ secrets.AWS_ROLE_ARN }}"
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "❌ AWS_ROLE_ARN secret is EMPTY or not set"
          else
            echo "✅ AWS_ROLE_ARN secret is present"
          fi

      - name: Build Lambda deployment package
        run: |
          mkdir -p /tmp/lambda-deploy
          cp -r src prompts lambda /tmp/lambda-deploy/
          cp package.json /tmp/lambda-deploy/
          cp -r node_modules /tmp/lambda-deploy/

          cd /tmp/lambda-deploy
          zip -r $GITHUB_WORKSPACE/guest-messaging-harness.zip . -q

          echo "Lambda package size:"
          ls -lh $GITHUB_WORKSPACE/guest-messaging-harness.zip

      - name: Configure AWS credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          # Optional but recommended for tighter security
          role-session-name: github-actions-harness-deploy

      - name: Deploy to Lambda
        run: |
          FUNCTION_NAME="guest-messaging-agent-harness"
          RUNTIME="nodejs24.x"

          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://guest-messaging-harness.zip \
            --region us-east-1

          aws lambda wait function-updated \
            --function-name $FUNCTION_NAME \
            --region us-east-1

          CURRENT_RUNTIME=$(aws lambda get-function-configuration \
            --function-name $FUNCTION_NAME \
            --region us-east-1 \
            --query 'Runtime' --output text)

          if [ "$CURRENT_RUNTIME" != "$RUNTIME" ]; then
            echo "Updating runtime from $CURRENT_RUNTIME to $RUNTIME"
            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --runtime $RUNTIME \
              --region us-east-1
            aws lambda wait function-updated \
              --function-name $FUNCTION_NAME \
              --region us-east-1
          else
            echo "Runtime already $RUNTIME"
          fi

          # Keep the function timeout just above the in-Lambda send budget (~3 min)
          # so a hung invoke cannot overlap the next SQS receive (visibility 12 min).
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --timeout 360 \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name $FUNCTION_NAME \
            --region us-east-1

          # Two-layer retry: 4 SQS receives, 12 min visibility → ~36–40 min then DLQ.
          aws sqs set-queue-attributes \
            --queue-url https://sqs.us-east-1.amazonaws.com/834917996497/grok_message \
            --attributes '{"VisibilityTimeout":"720","RedrivePolicy":"{\"deadLetterTargetArn\":\"arn:aws:sqs:us-east-1:834917996497:grok_message_dl\",\"maxReceiveCount\":4}"}' \
            --region us-east-1

          echo "Deployment of $FUNCTION_NAME completed (runtime: $RUNTIME, timeout 360s, grok_message visibility 720s / maxReceive 4)."

      - name: Deployment summary
        run: |
          echo "✅ Successfully deployed to AWS Lambda"
          echo "Function: guest-messaging-agent-harness"
          echo "Region: us-east-1"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
