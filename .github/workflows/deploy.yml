name: Deploy to AWS Lambda

on:
  # Automatic deployment on every push to main
  push:
    branches: [main]

  # Manual trigger (useful for emergency/hotfix deploys or rollbacks)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (for future use)'
        required: false
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy guest-messaging-agent-harness
    runs-on: ubuntu-latest

    # IMPORTANT: For safe continuous deployment, you MUST enable Branch Protection
    # on the `main` branch and require the CI jobs ("Run Tests" and "Run Evaluation Suite")
    # to pass before allowing merges. This prevents broken code from being deployed.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Lambda deployment package
        run: |
          mkdir -p /tmp/lambda-deploy
          cp -r src prompts lambda /tmp/lambda-deploy/
          cp package.json /tmp/lambda-deploy/
          cp -r node_modules /tmp/lambda-deploy/

          cd /tmp/lambda-deploy
          zip -r $GITHUB_WORKSPACE/guest-messaging-harness.zip . -q

          echo "Lambda package size:"
          ls -lh $GITHUB_WORKSPACE/guest-messaging-harness.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # === RECOMMENDED: Use GitHub OIDC (no long-lived AWS keys) ===
          # See docs below for setup instructions.
          #
          # Quick start (less secure): Store long-lived keys as GitHub Secrets
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          FUNCTION_NAME="guest-messaging-agent-harness"

          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://guest-messaging-harness.zip \
            --region us-east-1

          echo "Deployment of $FUNCTION_NAME completed."

      - name: Deployment summary
        run: |
          echo "✅ Successfully deployed to AWS Lambda"
          echo "Function: guest-messaging-agent-harness"
          echo "Region: us-east-1"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
